[project]
name = "vigie"
version = "0.1.0"
description = "Privacy-first shoplifting detection from human pose sequences, real-time on a CPU."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Pollux Gronier" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "opencv-python>=4.9",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
live = ["ultralytics>=8.3", "openvino>=2024.0", "lap>=0.5"]
dev = ["pytest>=8", "ruff>=0.5", "gdown>=5"]

[project.scripts]
vigie = "vigie.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigie"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
