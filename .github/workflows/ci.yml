name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (no torch needed for the test suite)
        run: |
          pip install numpy scipy scikit-learn opencv-python-headless tqdm matplotlib pytest ruff
          pip install -e . --no-deps
      - name: Lint
        run: ruff check src scripts tests && ruff format --check src scripts tests
      - name: Tests
        run: pytest -q
